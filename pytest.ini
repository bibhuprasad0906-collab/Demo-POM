[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    smoke: Smoke tests
    regression: Regression tests
    p1: Priority 1 tests
    p2: Priority 2 tests
    web: Web platform tests
    mobile: Mobile platform tests
testpaths = tests
log_cli = true
log_cli_level = INFO
log_file = logs/pytest.log
log_file_level = DEBUG