[pytest]
# Pytest Configuration for Selenium Automation Framework

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    smoke: Smoke tests for critical functionality
    regression: Full regression test suite
    auth: Authentication related tests
    login: Login functionality tests
    positive: Positive test scenarios
    negative: Negative test scenarios
    p1: Priority 1 - Critical tests
    p2: Priority 2 - High priority tests
    p3: Priority 3 - Medium priority tests
    web: Web platform tests
    mobile: Mobile platform tests
    security: Security and compliance tests

# Console output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    --maxfail=5
    --html=reports/test_report.html
    --self-contained-html

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] [%(filename)s:%(lineno)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout settings
timeout = 300
timeout_method = thread

# Coverage options (if pytest-cov is installed)
# addopts = --cov=src --cov-report=html --cov-report=term

# Parallel execution (requires pytest-xdist)
# addopts = -n auto