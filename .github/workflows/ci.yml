name: Login Test Suite CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Run nightly at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
        browser: ['chrome', 'firefox']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run smoke tests
        env:
          BASE_URL: "https://example.com/login"
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          TIMEOUT: "10"
          SCREENSHOT_ON_FAILURE: "true"
        run: |
          pytest -v -m smoke --tb=short --maxfail=3
      
      - name: Run regression tests
        env:
          BASE_URL: "https://example.com/login"
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          TIMEOUT: "10"
          SCREENSHOT_ON_FAILURE: "true"
        run: |
          pytest -v -m regression --tb=short
      
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.python-version }}
          path: screenshots/
          retention-days: 7
      
      - name: Generate HTML report
        if: always()
        run: |
          pytest --html=report.html --self-contained-html
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-report-${{ matrix.browser }}-${{ matrix.python-version }}
          path: report.html
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install linting tools
        run: |
          pip install flake8 pylint black
      
      - name: Run flake8
        run: |
          flake8 src/ tests/ --max-line-length=120 --exclude=__pycache__
      
      - name: Run pylint
        run: |
          pylint src/ tests/ --disable=C0111,R0903
      
      - name: Check code formatting with black
        run: |
          black --check src/ tests/