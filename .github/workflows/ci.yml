name: Selenium Pytest CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  test:
    name: Run Selenium Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
        browser: ['chrome', 'firefox']
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create necessary directories
        run: |
          mkdir -p logs screenshots reports tests/data
      
      - name: Run tests with pytest
        env:
          BASE_URL: http://localhost:8080
          BROWSER: ${{ matrix.browser }}
          HEADLESS: true
          TIMEOUT: 10
          SCREENSHOT_ON_FAILURE: true
          LOG_LEVEL: INFO
        run: |
          pytest -v \
            --maxfail=5 \
            --tb=short \
            --html=reports/test_report_${{ matrix.browser }}_py${{ matrix.python-version }}.html \
            --self-contained-html \
            --junitxml=reports/junit_${{ matrix.browser }}_py${{ matrix.python-version }}.xml
        continue-on-error: true
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports-${{ matrix.browser }}-py${{ matrix.python-version }}
          path: |
            reports/
            logs/
          retention-days: 30
      
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: screenshots-${{ matrix.browser }}-py${{ matrix.python-version }}
          path: screenshots/
          retention-days: 30
      
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/junit_*.xml
          check_name: Test Results (${{ matrix.browser }}, Python ${{ matrix.python-version }})
  
  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create necessary directories
        run: |
          mkdir -p logs screenshots reports tests/data
      
      - name: Run smoke tests
        env:
          BASE_URL: http://localhost:8080
          BROWSER: chrome
          HEADLESS: true
          TIMEOUT: 10
        run: |
          pytest -v -m smoke \
            --maxfail=1 \
            --tb=short \
            --html=reports/smoke_test_report.html \
            --self-contained-html
      
      - name: Upload smoke test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: smoke-test-reports
          path: reports/
          retention-days: 30
  
  security-tests:
    name: Run Security Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create necessary directories
        run: |
          mkdir -p logs screenshots reports tests/data
      
      - name: Run security tests
        env:
          BASE_URL: http://localhost:8080
          BROWSER: chrome
          HEADLESS: true
          TIMEOUT: 10
        run: |
          pytest -v -m security \
            --maxfail=3 \
            --tb=short \
            --html=reports/security_test_report.html \
            --self-contained-html
      
      - name: Upload security test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-test-reports
          path: reports/
          retention-days: 30
  
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint black
      
      - name: Run pylint
        run: |
          pylint src/ tests/ --exit-zero --output-format=text > reports/pylint_report.txt
        continue-on-error: true
      
      - name: Check code formatting with black
        run: |
          black --check src/ tests/
        continue-on-error: true
      
      - name: Upload code quality reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: code-quality-reports
          path: reports/
          retention-days: 30