name: CI - Selenium Pytest Automation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
        browser: ['chrome']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create test directories
        run: |
          mkdir -p logs screenshots
      
      - name: Run tests with pytest
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'http://localhost:8000' }}
          BROWSER: ${{ matrix.browser }}
          HEADLESS: true
          TIMEOUT: 10
          SCREENSHOT_ON_FAILURE: true
        run: |
          pytest -v --tb=short --maxfail=1 --disable-warnings
      
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-logs-${{ matrix.python-version }}-${{ matrix.browser }}
          path: logs/
          retention-days: 7
      
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: screenshots-${{ matrix.python-version }}-${{ matrix.browser }}
          path: screenshots/
          retention-days: 7
      
      - name: Generate HTML report
        if: always()
        run: |
          pip install pytest-html
          pytest --html=report.html --self-contained-html || true
      
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-report-${{ matrix.python-version }}-${{ matrix.browser }}
          path: report.html
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint
      
      - name: Lint with flake8
        run: |
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Lint with pylint
        run: |
          pylint src --exit-zero